# =============================================================================
# Build + push de l'image Docker Node.js (runtime NeoHeberg)
# -----------------------------------------------------------------------------
# Construit l'image runtime Node.js (Debian slim + fnm) et la pousse sur le
# registry Harbor auto-hébergé (registry.axel-l.fr, projet `neoheberg_egg`,
# dépôt `nodejs`).
#
# Déclencheurs :
#   - push sur `main` qui touche le Dockerfile / les scripts de l'image ;
#   - lancement manuel (workflow_dispatch) depuis l'onglet Actions.
#
# L'image est taguée :
#   - `latest`          -> tirée par Pterodactyl lors des nouvelles installations ;
#   - `<sha du commit>` -> traçabilité / rollback.
#
# Authentification : robot account Harbor `robot$pusher`
# (secrets du repo HARBOR_USERNAME / HARBOR_PASSWORD).
# =============================================================================

name: 🐳 Build Node.js — NeoHeberg Egg

on:
  push:
    branches:
      - main
    paths:
      - 'docker/nodejs/**'
      - '.github/workflows/build-nodejs-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Builder buildx avec le driver `docker-container` : requis pour le
      # cache `type=gha`.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: registry.axel-l.fr
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker/nodejs
          file: ./docker/nodejs/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            registry.axel-l.fr/neoheberg_egg/nodejs:latest
            registry.axel-l.fr/neoheberg_egg/nodejs:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
